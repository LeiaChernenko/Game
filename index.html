<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game-Cards</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

    <header class="header">

        <div class="menu">
            <button id="menuButton">Menu</button>

            <div class="levels" id="levels">
                <button data-size="4">level 1</button>
                <button data-size="6">level 2</button>
                <button data-size="10">level 3</button>
                <button data-size="14">level 4</button>
            </div>
        </div>

        <div class="title">Twinly</div>

        <div class="info">
            <button class="rulesButton" id="rulesButton">Rules</button>

            <div class="textRules" id="textRules">
                <h3>Лінь писати, потом колись</h3>
            </div>
        </div>

    </header>

    <main class="main">
        <div class="timer" id="timer">1:00</div>
        <div class="game" id="game"></div>
        <button class="startButton" id="startButton">Start game</button>
    </main>

    <footer>Copyright © 2026 Leia represents "Яніс МОЛОДЕЦЬ!!!"</footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="logik.js"></script>

</body>
</html>
